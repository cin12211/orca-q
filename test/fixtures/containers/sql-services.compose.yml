services:
  postgres:
    profiles: [postgres, sql, all]
    image: docker.io/library/postgres:16-alpine
    ports:
      - '${ORCAQ_POSTGRES_PORT:-5432}:5432'
    environment:
      POSTGRES_DB: '${ORCAQ_POSTGRES_DATABASE:-pagila}'
      POSTGRES_USER: '${ORCAQ_POSTGRES_USER:-orcaq}'
      POSTGRES_PASSWORD: '${ORCAQ_POSTGRES_PASSWORD:-orcaq}'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./sql-init/postgres/00-bootstrap.sh:/docker-entrypoint-initdb.d/00-bootstrap.sh:ro
      - ../datasets/postgres/postgres-sakila-schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
      - ../datasets/postgres/postgres-sakila-insert-data-optimized.sql:/docker-entrypoint-initdb.d/20-data.sql:ro
      - ./sql-init/postgres/99-grants.sh:/docker-entrypoint-initdb.d/99-grants.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 20

  mysql:
    profiles: [mysql, sql, all]
    image: docker.io/library/mysql:8.4
    ports:
      - '${ORCAQ_MYSQL_PORT:-3306}:3306'
    environment:
      MYSQL_DATABASE: '${ORCAQ_MYSQL_DATABASE:-sakila}'
      MYSQL_USER: '${ORCAQ_MYSQL_USER:-orcaq}'
      MYSQL_PASSWORD: '${ORCAQ_MYSQL_PASSWORD:-orcaq}'
      MYSQL_ROOT_PASSWORD: '${ORCAQ_MYSQL_ROOT_PASSWORD:-root}'
    volumes:
      - mysql-data:/var/lib/mysql
      - ../datasets/mysql/mysql-sakila-schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
      - ../datasets/mysql/mysql-sakila-insert-data-optimized.sql:/docker-entrypoint-initdb.d/20-data.sql:ro
      - ./sql-init/mysql/99-grants.sh:/docker-entrypoint-initdb.d/99-grants.sh:ro
    command:
      - '--mysql-native-password=ON'
      - '--mysqlx=0'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent',
        ]
      interval: 5s
      timeout: 5s
      retries: 30

  mariadb:
    profiles: [mariadb, sql, all]
    image: docker.io/library/mariadb:11.4
    ports:
      - '${ORCAQ_MARIADB_PORT:-3307}:3306'
    environment:
      MARIADB_DATABASE: '${ORCAQ_MARIADB_DATABASE:-sakila}'
      MARIADB_USER: '${ORCAQ_MARIADB_USER:-orcaq}'
      MARIADB_PASSWORD: '${ORCAQ_MARIADB_PASSWORD:-orcaq}'
      MARIADB_ROOT_PASSWORD: '${ORCAQ_MARIADB_ROOT_PASSWORD:-root}'
    volumes:
      - mariadb-data:/var/lib/mysql
      - ../datasets/mysql/mysql-sakila-schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
      - ../datasets/mysql/mysql-sakila-insert-data-optimized.sql:/docker-entrypoint-initdb.d/20-data.sql:ro
      - ./sql-init/mysql/99-grants.sh:/docker-entrypoint-initdb.d/99-grants.sh:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'mariadb-admin ping -h 127.0.0.1 -u$$MARIADB_USER -p$$MARIADB_PASSWORD --silent',
        ]
      interval: 5s
      timeout: 5s
      retries: 30

  # Heavy images: part of `all` but not `sql`; start one with --profile cockroachdb|mssql|oracle.
  cockroachdb:
    profiles: [cockroachdb, all]
    image: docker.io/cockroachdb/cockroach:v24.3.5
    command: start-single-node --insecure
    ports:
      - '${ORCAQ_COCKROACHDB_PORT:-26257}:26257'
    volumes:
      - ./sql-init/cockroachdb:/fixtures:ro

  mssql:
    profiles: [mssql, all]
    # SQL Server images are amd64-only; Apple Silicon runs them under Rosetta.
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    ports:
      - '${ORCAQ_MSSQL_PORT:-1433}:1433'
    environment:
      ACCEPT_EULA: 'Y'
      MSSQL_SA_PASSWORD: '${ORCAQ_MSSQL_PASSWORD:-OrcaQ_Passw0rd!}'
    volumes:
      - ../datasets/sql-server:/fixtures:ro

  oracle:
    profiles: [oracle, all]
    image: docker.io/gvenzl/oracle-free:23-slim
    ports:
      - '${ORCAQ_ORACLE_PORT:-1521}:1521'
    environment:
      ORACLE_PASSWORD: '${ORCAQ_ORACLE_PASSWORD:-orcaq}'
      APP_USER: '${ORCAQ_ORACLE_USER:-orcaq}'
      APP_USER_PASSWORD: '${ORCAQ_ORACLE_PASSWORD:-orcaq}'
    volumes:
      - ../datasets/oracle/oracle-sakila-schema.sql:/container-entrypoint-initdb.d/10-schema.sql:ro
      - ../datasets/oracle/oracle-sakila-insert-data-optimized.sql:/container-entrypoint-initdb.d/20-data.sql:ro
      - ./sql-init/oracle/30-reset-sequences.sql:/container-entrypoint-initdb.d/30-reset-sequences.sql:ro
    healthcheck:
      test: ['CMD', 'healthcheck.sh']
      interval: 10s
      timeout: 10s
      retries: 60

volumes:
  postgres-data:
  mysql-data:
  mariadb-data:
