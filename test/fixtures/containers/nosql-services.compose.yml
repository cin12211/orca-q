services:
  redis:
    profiles: [redis, all]
    image: docker.io/library/redis:7.4-alpine
    ports:
      - '${ORCAQ_REDIS_PORT:-6379}:6379'
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  mongodb:
    profiles: [mongodb, all]
    image: docker.io/library/mongo:7
    ports:
      - '${ORCAQ_MONGODB_PORT:-27017}:27017'
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', 'db.runCommand({ ping: 1 })']
      interval: 5s
      timeout: 3s
      retries: 20

  # Message brokers are opt-in (not part of `all`): --profile rabbitmq | kafka
  rabbitmq:
    profiles: [rabbitmq]
    image: docker.io/library/rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: '${ORCAQ_RABBITMQ_USER:-orcaq}'
      RABBITMQ_DEFAULT_PASS: '${ORCAQ_RABBITMQ_PASSWORD:-orcaq}'
    ports:
      - '${ORCAQ_RABBITMQ_AMQP_PORT:-5672}:5672'
      - '${ORCAQ_RABBITMQ_MANAGEMENT_PORT:-15672}:15672'
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 5s
      timeout: 5s
      retries: 30

  kafka:
    profiles: [kafka]
    image: docker.io/apache/kafka:3.9.0
    ports:
      - '${ORCAQ_KAFKA_PORT:-9092}:9092'
      - '${ORCAQ_KAFKA_SASL_PORT:-9094}:9094'
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,SASL_PLAINTEXT://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:${ORCAQ_KAFKA_PORT:-9092},SASL_PLAINTEXT://localhost:${ORCAQ_KAFKA_SASL_PORT:-9094}
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,SASL_PLAINTEXT:SASL_PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_SASL_ENABLED_MECHANISMS: PLAIN
      KAFKA_OPTS: -Djava.security.auth.login.config=/etc/kafka/orcaq_jaas.conf
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - ./kafka/kafka_server_jaas.conf:/etc/kafka/orcaq_jaas.conf:ro
